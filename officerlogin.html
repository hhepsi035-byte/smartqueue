<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Portal - Login</title>
    <link rel="stylesheet" href="officer.css">
</head>
<body>

    <div class="card">
        <h2>Government Office Portal</h2>
        <p class="subtext">Restricted access for authorized staff only.</p>

        <form action="officerlogin.php" method="POST">
            <div class="form-group">
                <label for="employee_id">Employee ID (Must start with EMP)</label>
                <input type="text" id="employee_id" name="employee_id" placeholder="e.g. EMP1001" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" href="officerpanel.php" class="btn btn-primary">Login to Counter Portal</button>
            
        </form>
    </div>

</body>
</html>
