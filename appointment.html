<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQueue - Book Appointment</title>
    <!-- External CSS Link -->
    <link rel="stylesheet" href="appointment.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="booking-container">
        <div class="booking-card">
            
            <div class="card-header">
                <h2>Book Appointment</h2>
                <p>Select your date and time slot (Available until 5:00 PM).</p>
            </div>

            <!-- Form submits directly to your PHP backend -->
            <form action="appointment.php" method="POST" class="appointment-form">
                
                <div class="form-group">
                    <label for="scheduled_date">Select Date</label>
                    <input 
                        type="date" 
                        id="scheduled_date" 
                        name="scheduled_date" 
                        class="form-control"
                        required>
                </div>

                <div class="form-group">
                    <label for="scheduled_time">Select Time (Till 5:00 PM)</label>
                    <input 
                        type="time" 
                        id="scheduled_time" 
                        name="scheduled_time" 
                        class="form-control"
                        min="09:00" 
                        max="17:00" 
                        required>
                    <small class="help-text">Operating hours: 9:00 AM – 5:00 PM</small>
                </div>

                <button type="submit" class="btn-submit">Generate Token & OTP</button>

            </form>

        </div>
    </div>

    <script>
        // Restrict calendar selection so users cannot pick past dates
        const dateInput = document.getElementById('scheduled_date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
    </script>

</body>
</html>
